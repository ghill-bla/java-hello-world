<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Java App via CheerpJ</title>
    <!-- Load the latest CheerpJ 5.0 runtime -->
    <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
    <script type="module">
        // Initialize the CheerpJ OpenJDK environment
        await cheerpjInit();
        
        // Create a canvas display area for the Swing/AWT window
        cheerpjCreateDisplay(800, 600);
        
        // Execute the main method inside your compiled JAR
        // Dynamically gets the repository's subfolder path
        const currentPath = window.location.pathname;
        const jarPath = `/app${currentPath}${currentPath.endsWith('/') ? '' : '/'}HelloWorld.jar`;
        await cheerpjRunJar(jarPath);
    </script>
</body>
</html>
